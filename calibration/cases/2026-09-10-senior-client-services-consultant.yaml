description: |
  Job title: Senior Client Services Consultant
  
  
  Department: Workforce \- Client Services
  
  
  Reports to: Client Services Manager
  
  
  Location: Remote
  
    
  
  Applicants must be within a commutable distance of Birmingham and able to attend client sites and meetings up to 3 days per week as required.
  
   **ABOUT US**
  
    
  
  We are a well\-established and trusted health economy partner, saving millions for reinvestment in health and social care through our Workforce, Financial, Care and Specialty Transformation businesses.
  
    
  
  We are dedicated to improving the health economy through expert advisors, established technology, and best practice process improvement. Our work has also been recognised with numerous HR and Finance industry awards.
  
    
  
  As a base all our employees work from the comfort of their own home. We now have over 400 employees based across the length and breadth of the UK, enjoying the flexibility of working remotely.
  
    
  
  We are proud to say that we are currently the:
  
    
  
  \#1 Best Large Company To Work For in the UK
  
  
  \#1 Best Consultancy To Work For in the UK
  
    
  
  We are a 3\-star (out of 3\) rated company by Best Companies, recognising Liaison Group as a 'World\-class Company to Work For'.
  
   **JOB SUMMARY**
  
    
  
  We are looking for a proactive and customer\-focused Senior Client Services Consultant to help our clients maximise the value, utilisation and benefits of Liaison Workforce solutions. Acting as a trusted advisor, you will build strong relationships with stakeholders, provide strategic and operational guidance, and lead regular client reviews to ensure successful service delivery. Managing your own portfolio of clients, you will work closely with Regional Client Services Consultants to drive service improvements, enhance customer outcomes, and identify opportunities for growth, ensuring clients achieve the greatest possible return on their investment.
  
   **PRINCIPAL TASKS \& ACTIVITIES**
  
    
  
  * Working as a key member of the Client Services team delivering workforce solutions across a defined client portfolio.
  * Building and managing effective relationships with key client stakeholders at operational and managerial level.
  * Advising and assisting clients to maximise utilisation, savings, efficiencies and service benefits.
  * Leading operational review meetings, presenting insight and making recommendations based on client data.
  * Producing, analysing and interpreting management information and performance reports for clients.
  * Supporting activities across workforce solutions throughout the Client lifecycle.
  * Identifying opportunities to improve client outcomes through enhanced utilisation of solutions and services.
  * Identifying opportunities to broaden the service offering and support commercial growth objectives.
  * Working collaboratively with Client Services Managers, Commercial teams and wider business functions to support client success.
  * Acting as an escalation point for complex client issues, identifying solutions and driving resolution.
  * Providing guidance, coaching and support to Regional Client Services Consultants to promote consistency and best practice.
  * Supporting onboarding, knowledge sharing and development activities across the Client Services function.
  * Visiting client sites, facilitating meetings and delivering presentations to stakeholders.
  * Ensuring accurate and timely recording of client activity, actions and management information within CRM systems.
  * Providing recommendations for enhancements to processes, services and technology solutions.
  * Ensuring data security obligations concerning clients and the company are always adhered to.
  
   **EXPERIENCE**
  
    
  
  Essential:
  
    
  
  * Experience within NHS, healthcare environment.
  * Experience supporting or mentoring colleagues.
  * Experience delivering operational reviews, service reviews or client presentations.
  * Experience managing client relationships within a service delivery, consultancy or account management environment.
  * Experience presenting information and recommendations to stakeholder groups.
  * Experience interpreting and analysing data to provide meaningful insight
  * Experience managing multiple priorities and client demands simultaneously.
  * Demonstrable experience working with senior stakeholders
  * Account management experience.
  
   **SKILLS \& COMPETENCIES**
  
    
  
  Essential:
  
    
  
  * Excellent stakeholder management and relationship\-building skills.
  * Consultative and solution\-focused approach to client management.
  * Strong analytical and logical thinking skills with high attention to detail.
  * Ability to influence and engage stakeholders at multiple organisational levels.
  * Excellent verbal and written communication skills.
  * Strong organisational and time management skills.
  * Ability to work independently and manage a varied workload.
  * Customer\-focused with a proactive approach to problem solving.
  * High level of competency in Microsoft Excel, Word, PowerPoint and CRM systems.
  
    
  
  Desirable:
  
    
  
  * Project implementation experience.
  * Experience delivering training, workshops or stakeholder engagement sessions.
  * Knowledge of workforce management or healthcare operational processes.
  
   **QUALIFICATIONS \& TRAINING**
  
    
  
  Essential:
  
    
  
  * Minimum A Level or equivalent qualification.
  
    
  
  Desirable:
  
    
  
  * Degree or equivalent professional qualification.
  
   **OUR VALUES**
  
    
  
  You will be expected to demonstrate Liaison's core values: Care, Honesty, Inspire and Guide, and embody our behaviours\-be present, choose your attitude, make someone's day, and have fun.
  
   **FURTHER INFORMATION**
  
    
  
  We are proud to support our colleagues and will offer an interview to any candidate with a disability, should they match the skills and experience required for the role.
  
    
  
  Liaison Group is committed to creating a diverse and inclusive environment and is proud to be an equal opportunity employer. All qualified applicants will receive consideration for employment regardless of race, colour, religion, gender, gender identity or expression, sexual orientation, national origin, genetics, disability, age, or veteran status. We pride ourselves on being a place where we can all be ourselves and succeed on merit.
  
    
  
  Liaison Group are committed to the Good Recruitment Campaign and are official signatories for the Good Recruitment Charter.
  
    
  
  We reserve the right to close this vacancy early if we receive a high volume of applications.
  
    
  
  Thank you for your interest in joining Liaison Group
